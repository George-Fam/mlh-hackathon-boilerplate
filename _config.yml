# --------------
# -- Settings --
# --------------

# If you are hosting in a sub-folder, for example: https://mlh.github.io/mlh-hackathon-boilerplate/,
# you must specify it as the baseurl
# If you hosting as a root, for example: htttps://[github username].github.io, then leave it blank
baseurl: "/mlh-hackathon-boilerplate"

# uncomment the next line if you are hosting as a root and not sub-folder
# for example, when runnig locally at http://127.0.0.1:4000/
# baseurl: ""

# If you're using GitHub pages without a custom domain, this is "https://[github username].github.io"
# If you're using GitHub pages with a custom domain, this is "http://[your domain]" (or https if you're using SSL)
url: "https://george-fam.github.io" # TODO: Change for proper domain name later

# The ability to use custom themes.
style:
  theme: "original"

# This will help you track who's visiting your website.
tracking:
  google_analytics: "" # TODO: Add later once domain name is locked down

# Let people connect & engage with you through social media.
social:
  twitter_handle: "ageei" # TODO: Verify if were going to use this twitter handle or make a new one

# This is Search Engine Optimization. It'll help your website look better on search.
seo:
  title:       "AGEEI Designathon | UQAM"
  description: "A student-run designathon by the AGEEI for UQAM students, focused on UX, product thinking, and creative problem-solving."
  image:       "images/ageei-logo.png"

# Event information.
event:
  name:        "AGEEI Designathon"
  description: "A 48-hour designathon for UQAM students focused on UX, product thinking, and creative problem-solving."
  # TODO: Add later
  # date:        "March 2026"
  # location:    "Université du Québec à Montréal (UQAM), Montréal, QC"

  trust_badge:
    year:   "2026"  # season year
    region: "na"    # "na" or "eu"
    color:  "white" # "white", "black", "gray", "red", "blue" or "yellow"

  hero:
    links:
      - text: "Apply"
        my_mlh:
          client_id:    "0e2f9fc2921d3ad3e12ae900af630d09382e1b3dc1b5b50de2b01b70ad64dbee"
          redirect_uri: "https://mlh.github.io/mlh-hackathon-boilerplate/success.html"
      - text: "Sponsor"
        href: "mailto:sponsors@ageei.org"

  about:
    description: >
      The AGEEI Designathon is a student-led event organized by the
      Association Générale des Étudiantes et Étudiants en Informatique (AGEEI)
      at UQAM. Over two days, participants collaborate in small teams to design
      thoughtful, user-centered solutions to real-world problems.
      The event emphasizes UX, UI, and product thinking rather than full technical
      implementation. No prior design experience is required; curiosity,
      creativity, and collaboration are what matter most.

  # Info Sections
  info:
    sections:
      - image: "images/image1.png"
        title: "LEARN."
        description: >
          Learn the fundamentals of UX, UI, and product design through short
          workshops, mentor guidance, and hands-on exploration.
      - image: "images/image2.png"
        title: "DESIGN."
        description: >
          Work in teams to ideate, prototype, and iterate on a design solution,
          from problem definition to wireframes and interactive mockups.
      - image: "images/image3.png"
        title: "PRESENT."
        description: >
          Present your work to peers, mentors, and judges, receive constructive
          feedback, and celebrate strong design and creative thinking.

  # Frequently asked questions.
  faq:
    - question: "What is a Designathon?"
      answer: >
        A designathon is a collaborative event focused on design and
        user experience rather than full technical implementation.
        Teams work on ideation, UX research, wireframes, and prototypes
        to propose solutions to real-world problems.
    - question: "Who can participate?"
      answer: >
        The event is open to students currently enrolled at UQAM. Beginners are welcome.
    - question: "How much does it cost?"
      answer: >
        Nothing. Participation is completely free.
    - question: "Do I need a team to apply?"
      answer: >
        No. You can apply solo or with friends. Team formation activities
        will take place at the beginning of the event.
    - question: "Where will the event take place?"
      answer: >
        The designathon will be hosted in person at UQAM.
        Exact rooms and logistics will be shared closer to the event.
    - question: "What is Major League Hacking?"
      answer: >
        Major League Hacking is [the official student hackathon league](https://mlh.io) in North America & Europe.
        We work with over 200 Member Events and empower over 70,000 students every year.
    - question: "Is there a code of conduct?"
      answer: >
        Yes there is. We enforce it very strongly. You can [find it here](https://static.mlh.io/docs/mlh-code-of-conduct.pdf).

  # This is the message you'll receive once you've registered.
  register:
    message: >
      Thanks for registering! More information about the schedule,
      challenges, and logistics will be sent closer to the event.

# ----------------------------------------------------
# -- Ignore this unless you know what you're doing. --
# ----------------------------------------------------

markdown: kramdown
exclude:
 - node_modules
 - gulpfile.js
 - Gemfile
 - Gemfile.lock
 - package.json
 - README.md
 - CNAME
